<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: white;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 240px;
            background: #1a0a0a;
            display: flex;
            flex-direction: column;
            padding: 24px 0;
            border-right: 1px solid #2a1a1a;
            flex-shrink: 0;
        }
        .sidebar-logo {
            padding: 0 24px 24px;
            border-bottom: 1px solid #2a1a1a;
            margin-bottom: 16px;
        }
        .sidebar-logo h2   { font-size: 22px; color: #ff4444; font-weight: 700; }
        .sidebar-logo span { font-size: 11px; color: #666; letter-spacing: 2px; text-transform: uppercase; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        .nav-item:hover { color: white; background: #0f0505; }
        .nav-item.active { color: white; background: #0f0505; border-left: 3px solid #ff4444; }
        .nav-bottom { margin-top: auto; border-top: 1px solid #2a1a1a; padding-top: 16px; }
        .nav-logout {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            color: #ff4444;
            text-decoration: none;
            font-size: 14px;
        }
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            background: #0f0f1a;
        }
        .page-title    { font-size: 28px; font-weight: 700; margin-bottom: 8px; color: #ff4444; }
        .page-subtitle { font-size: 14px; color: #666; margin-bottom: 32px; }
        .flash-error   { background: #ff4444; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .flash-success { background: #00c851; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        {% block styles %}{% endblock %}
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">
            <h2>Admin</h2>
            <span>Control Center</span>
        </div>
        <a href="/admin/dashboard"    class="nav-item {% if request.path == '/admin/dashboard' %}active{% endif %}">
            <span class="icon">⊞</span> Dashboard
        </a>
        <a href="/admin/books"        class="nav-item {% if request.path == '/admin/books' %}active{% endif %}">
            <span class="icon">📚</span> Books
        </a>
        <a href="/admin/loans"        class="nav-item {% if request.path == '/admin/loans' %}active{% endif %}">
            <span class="icon">📋</span> Book Loans
        </a>
        <a href="/admin/fines"        class="nav-item {% if request.path == '/admin/fines' %}active{% endif %}">
            <span class="icon">💰</span> Fines
        </a>
        <a href="/admin/reservations" class="nav-item {% if request.path == '/admin/reservations' %}active{% endif %}">
            <span class="icon">🔖</span> Reservations
        </a>
        <a href="/admin/users"        class="nav-item {% if request.path == '/admin/users' %}active{% endif %}">
            <span class="icon">👥</span> Users
        </a>
        <div class="nav-bottom">
            <a href="/logout" class="nav-logout">
                <span class="icon">🚪</span> Logout
            </a>
        </div>
    </div>
    <div class="main">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
